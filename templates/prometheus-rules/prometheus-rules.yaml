{{- if .Values.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-cluster-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    app: kube-prometheus-stack
    release: {{ .Release.Name }}
    role: alert-rules
spec:
  groups:
  - name: node-resources
    rules:
    - alert: HighNodeCPU
      expr: sum(rate(container_cpu_usage_seconds_total{container!="POD",container!=""}[5m])) by (node) / sum(machine_cpu_cores) by (node) * 100 > 80
      for: 15m
      labels:
        severity: critical
        tier: node
      annotations:
        summary: "High CPU usage on node {{ `{{ $labels.node }}` }} ({{ `{{ $value }}` }}%)"
        description: "Node {{ `{{ $labels.node }}` }} has been running at {{ `{{ $value }}` }}% CPU for 15 minutes"
        runbook_url: "https://example.com/runbooks/node-cpu"

    - alert: HighNodeMemory
      expr: sum(container_memory_working_set_bytes{container!="POD",container!=""}) by (node) / sum(machine_memory_bytes) by (node) * 100 > 80
      for: 15m
      labels:
        severity: critical
        tier: node
      annotations:
        summary: "High memory usage on node {{ `{{ $labels.node }}` }} ({{ `{{ $value }}` }}%)"
        description: "Node {{ `{{ $labels.node }}` }} has been using {{ `{{ $value }}` }}% of memory for 15 minutes"
        runbook_url: "https://example.com/runbooks/node-memory"

    - alert: HighNodeDisk
      expr: (1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"})) * 100 > 85
      for: 30m
      labels:
        severity: warning
        tier: node
      annotations:
        summary: "High disk usage on node {{ `{{ $labels.node }}` }} ({{ `{{ $value }}` }}%)"
        description: "Node {{ `{{ $labels.node }}` }} has only {{ `{{ $value | humanizePercentage }}` }} disk space remaining"
        runbook_url: "https://example.com/runbooks/node-disk"

  - name: pod-resources
    rules:
    - alert: PodNotRunning
      expr: sum by (namespace, pod) (kube_pod_status_phase{phase!="Running"}) > 0
      for: 5m
      labels:
        severity: warning
        tier: pod
      annotations:
        summary: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} is not running"
        description: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} has been in state {{ `{{ $labels.phase }}` }} for 5 minutes"
        runbook_url: "https://example.com/runbooks/pod-status"

    - alert: HighPodCPU
      expr: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="POD"}[5m])) > 1
      for: 10m
      labels:
        severity: warning
        tier: pod
      annotations:
        summary: "High CPU usage in pod {{ `{{ $labels.pod }}` }} ({{ `{{ $value }}` }} cores)"
        description: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} is using {{ `{{ $value }}` }} CPU cores"
        runbook_url: "https://example.com/runbooks/pod-cpu"

    - alert: HighPodMemory
      expr: sum by (namespace, pod) (container_memory_working_set_bytes{container!="POD"}) > 2 * 1024 * 1024 * 1024
      for: 10m
      labels:
        severity: warning
        tier: pod
      annotations:
        summary: "High memory usage in pod {{ `{{ $labels.pod }}` }} ({{ `{{ $value | humanize }}` }} bytes)"
        description: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} is using {{ `{{ $value | humanize }}` }} bytes of memory"
        runbook_url: "https://example.com/runbooks/pod-memory"

  - name: service-resources
    rules:
    - alert: HighServiceCPU
      expr: sum by (service) (rate(container_cpu_usage_seconds_total{container!="POD"}[5m])) > 2
      for: 15m
      labels:
        severity: warning
        tier: service
      annotations:
        summary: "High CPU usage in service {{ `{{ $labels.service }}` }} ({{ `{{ $value }}` }} cores)"
        description: "Service {{ `{{ $labels.service }}` }} is using {{ `{{ $value }}` }} CPU cores"
        runbook_url: "https://example.com/runbooks/service-cpu"

    - alert: HighServiceMemory
      expr: sum by (service) (container_memory_working_set_bytes{container!="POD"}) > 4 * 1024 * 1024 * 1024
      for: 15m
      labels:
        severity: warning
        tier: service
      annotations:
        summary: "High memory usage in service {{ `{{ $labels.service }}` }} ({{ `{{ $value | humanize }}` }} bytes)"
        description: "Service {{ `{{ $labels.service }}` }} is using {{ `{{ $value | humanize }}` }} bytes of memory"
        runbook_url: "https://example.com/runbooks/service-memory"

  - name: daemonset-resources
    rules:
    - alert: HighDaemonSetCPU
      expr: sum by (daemonset) (rate(container_cpu_usage_seconds_total{container!="POD"}[5m])) > 1.5
      for: 15m
      labels:
        severity: warning
        tier: daemonset
      annotations:
        summary: "High CPU usage in DaemonSet {{ `{{ $labels.daemonset }}` }} ({{ `{{ $value }}` }} cores)"
        description: "DaemonSet {{ `{{ $labels.daemonset }}` }} is using {{ `{{ $value }}` }} CPU cores"
        runbook_url: "https://example.com/runbooks/daemonset-cpu"

    - alert: HighDaemonSetMemory
      expr: sum by (daemonset) (container_memory_working_set_bytes{container!="POD"}) > 2 * 1024 * 1024 * 1024
      for: 15m
      labels:
        severity: warning
        tier: daemonset
      annotations:
        summary: "High memory usage in DaemonSet {{ `{{ $labels.daemonset }}` }} ({{ `{{ $value | humanize }}` }} bytes)"
        description: "DaemonSet {{ `{{ $labels.daemonset }}` }} is using {{ `{{ $value | humanize }}` }} bytes of memory"
        runbook_url: "https://example.com/runbooks/daemonset-memory"

  - name: network
    rules:
    - alert: HighNetworkTraffic
      expr: sum by (node) (rate(container_network_receive_bytes_total[5m]) + rate(container_network_transmit_bytes_total[5m])) > 100 * 1024 * 1024
      for: 10m
      labels:
        severity: warning
        tier: network
      annotations:
        summary: "High network traffic on node {{ `{{ $labels.node }}` }} ({{ `{{ $value | humanize }}` }} bytes/s)"
        description: "Node {{ `{{ $labels.node }}` }} is handling {{ `{{ $value | humanize }}` }} bytes/s of network traffic"
        runbook_url: "https://example.com/runbooks/network-traffic"

  - name: pod-health
    rules:
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
        tier: pod
      annotations:
        summary: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} is crash looping"
        description: "Container {{ `{{ $labels.container }}` }} in pod {{ `{{ $labels.pod }}` }} has restarted {{ `{{ $value }}` }} times in the last 5 minutes"
        runbook_url: "https://example.com/runbooks/pod-crashlooping"

    - alert: PodNotReady
      expr: sum by (namespace, pod) (kube_pod_status_ready{condition="false"}) > 0
      for: 5m
      labels:
        severity: warning
        tier: pod
      annotations:
        summary: "Pod {{ `{{ $labels.pod }}` }} in namespace {{ `{{ $labels.namespace }}` }} is not ready"
        description: "Pod {{ `{{ $labels.pod }}` }} has been not ready for 5 minutes"
        runbook_url: "https://example.com/runbooks/pod-not-ready"
{{- end }}
